<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" role="img" aria-labelledby="title desc">
  <title id="title">Phase transition during transformer training</title>
  <desc id="desc">A loss curve that drops gradually, then sharply when induction heads form, then continues to decrease.</desc>
  <style>
    .axis { stroke: #c1ad8e; stroke-width: 1.2; }
    .grid { stroke: #d8c9aa; stroke-width: 0.6; stroke-dasharray: 3 4; }
    .label { font-family: "EB Garamond", Garamond, Georgia, serif; fill: #6b5a45; font-size: 14px; font-style: italic; }
    .heading { font-family: "EB Garamond", Garamond, Georgia, serif; fill: #3a3127; font-size: 17px; font-weight: 600; letter-spacing: 0.01em; }
    .annot { font-family: "EB Garamond", Garamond, Georgia, serif; fill: #8a5a3c; font-size: 13px; font-style: italic; }
    .curve { stroke: #b07c5a; stroke-width: 2.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .marker { stroke: #c69b7e; stroke-width: 1.2; stroke-dasharray: 4 4; }
    .endpt { fill: #b07c5a; }
    @media (prefers-color-scheme: dark) {
      .axis { stroke: #5d503e; }
      .grid { stroke: #3e3528; }
      .label { fill: #b8a78d; }
      .heading { fill: #ede1cc; }
      .annot { fill: #d9a577; }
      .curve { stroke: #d9a577; }
      .marker { stroke: #b8916e; }
      .endpt { fill: #d9a577; }
    }
  </style>

  <text class="heading" x="300" y="30" text-anchor="middle">Loss curve during transformer training</text>

  <!-- gridlines -->
  <line class="grid" x1="80" y1="100" x2="560" y2="100" />
  <line class="grid" x1="80" y1="170" x2="560" y2="170" />
  <line class="grid" x1="80" y1="240" x2="560" y2="240" />

  <!-- axes -->
  <line class="axis" x1="80" y1="60" x2="80" y2="320" />
  <line class="axis" x1="80" y1="320" x2="560" y2="320" />

  <!-- axis labels -->
  <text class="label" x="44" y="190" text-anchor="middle" transform="rotate(-90 44 190)">cross-entropy loss</text>
  <text class="label" x="320" y="355" text-anchor="middle">training steps</text>

  <!-- phase transition marker -->
  <line class="marker" x1="270" y1="60" x2="270" y2="320" />
  <text class="annot" x="280" y="80">induction heads form</text>
  <text class="annot" x="280" y="98">in-context learning emerges</text>

  <!-- the loss curve -->
  <path class="curve" d="M 80 80 C 130 95, 200 135, 250 158 C 260 162, 268 165, 270 167 C 280 195, 290 228, 310 245 C 380 260, 470 285, 560 295" />

  <!-- start/end markers -->
  <circle class="endpt" cx="80" cy="80" r="3.5" />
  <circle class="endpt" cx="560" cy="295" r="3.5" />
</svg>
